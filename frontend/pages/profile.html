<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profile — MCPP</title>
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<div class="layout">
  <div id="sidebar"></div>
  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Operator Profile</h1>
      <p class="page-subtitle">// session &amp; account info</p>
    </div>

    <div style="display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start">
      <div class="card" style="text-align:center;padding:32px">
        <div style="width:72px;height:72px;background:var(--green-glow);border:2px solid var(--green-border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--green);font-family:var(--font-mono);margin:0 auto 16px;" id="avatar-initials">?</div>
        <div style="font-size:18px;font-weight:700;" id="profile-username">—</div>
        <div style="font-size:11px;color:var(--text3);font-family:var(--font-mono);margin-top:4px;" id="profile-role">—</div>
        <div style="margin-top:20px">
          <button class="btn btn-danger btn-sm" style="width:100%" onclick="Auth.logout()">Sign Out</button>
        </div>
      </div>

      <div>
        <div class="card mb-20">
          <div class="card-title">Session Info</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
            <div style="background:var(--bg3);border-radius:var(--radius);padding:14px">
              <div style="font-size:10px;color:var(--text3);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px">Status</div>
              <div style="display:flex;align-items:center;gap:6px"><div class="pulse-dot" style="width:8px;height:8px"></div><span style="color:var(--green);font-size:13px;font-weight:600">Active</span></div>
            </div>
            <div style="background:var(--bg3);border-radius:var(--radius);padding:14px">
              <div style="font-size:10px;color:var(--text3);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px">Platform</div>
              <div style="font-size:13px;font-weight:600">MCPP v2.0</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Platform Links</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <a href="dashboard.html" class="btn btn-ghost">Dashboard</a>
            <a href="new-scan.html" class="btn btn-ghost">New Scan</a>
            <a href="history.html" class="btn btn-ghost">History</a>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/utils/auth.js"></script>
<script src="../assets/js/utils/helpers.js"></script>
<script src="../assets/js/components/toast.js"></script>
<script src="../assets/js/components/sidebar.js"></script>
<script>
Auth.guard();
const user = Auth.user() || {};
document.getElementById("profile-username").textContent = user.username || "—";
document.getElementById("profile-role").textContent     = user.role    || "analyst";
document.getElementById("avatar-initials").textContent  = (user.username||"?").slice(0,2).toUpperCase();
</script>
</body>
</html>
